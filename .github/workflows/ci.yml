name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peyajflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: peyajflow_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peyajflow -d peyajflow_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: pnpm --filter @peyajflow/web exec playwright-core install --with-deps chromium
      - name: Verify pilot in Chromium
        env:
          DATABASE_URL: postgresql+psycopg://peyajflow:test@127.0.0.1:5432/peyajflow_browser
          APP_ENV: test
          DEMO_MODE: "true"
          PHOTO_STORAGE: local
          APP_COOKIE_SECURE: "false"
          E2E_WEB_ORIGIN: http://127.0.0.1:3000
        run: |
          export PHOTO_DIR="$RUNNER_TEMP/peyajflow-photos"
          uv --directory services/api sync --locked
          uv --directory services/api run --locked python -m app.migrate
          uv --directory services/api run --locked python -m app.seed
          uv --directory services/api run --locked uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          pnpm --filter @peyajflow/web start --hostname 127.0.0.1 --port 3000 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          timeout 60 bash -c '
            until curl -fsS http://127.0.0.1:8000/health/ready >/dev/null &&
              curl -fsS http://127.0.0.1:3000/en/workspace >/dev/null; do
              sleep 1
            done
          '
          pnpm test:e2e
          SMOKE_DEMO_ID=farmer pnpm smoke

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://peyajflow:test@127.0.0.1:5432/peyajflow_test
      TEST_DATABASE_URL: postgresql+psycopg://peyajflow:test@127.0.0.1:5432/peyajflow_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peyajflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: peyajflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peyajflow -d peyajflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m app.migrate
      - run: uv run --locked alembic check
      - run: uv run --locked pytest -q
      - name: Evaluate the Bangla command resolver
        run: |
          uv run --locked python -m evals.intent_eval --check
          uv run --locked python -m evals.intent_eval --check --min-accuracy 0.9 \
            --dataset evals/data/intent-challenge.jsonl

  container:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: peyajflow-ci
    steps:
      - uses: actions/checkout@v6
      - name: Build and migrate Compose
        run: |
          docker compose config --quiet
          docker compose up --build -d
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:8000/health/ready; do sleep 1; done'
      - name: Restore a disposable database backup
        run: |
          docker compose exec -T api python -m app.seed
          docker compose exec -T db pg_dump -U peyajflow -Fc peyajflow > "$RUNNER_TEMP/peyajflow.dump"
          docker compose exec -T db createdb -U peyajflow peyajflow_restore_check
          docker compose exec -T db pg_restore -U peyajflow --exit-on-error --single-transaction --no-owner -d peyajflow_restore_check < "$RUNNER_TEMP/peyajflow.dump"
          source_head="$(docker compose exec -T db psql -U peyajflow -d peyajflow -Atc 'select version_num from alembic_version')"
          restored_head="$(docker compose exec -T db psql -U peyajflow -d peyajflow_restore_check -Atc 'select version_num from alembic_version')"
          test -n "$source_head" && test "$source_head" = "$restored_head"
          source_users="$(docker compose exec -T db psql -U peyajflow -d peyajflow -Atc 'select count(*) from users')"
          restored_users="$(docker compose exec -T db psql -U peyajflow -d peyajflow_restore_check -Atc 'select count(*) from users')"
          test "$source_users" -gt 0 && test "$source_users" = "$restored_users"
      - name: Collect failed service diagnostics
        if: failure()
        run: docker compose logs --no-color api migrate
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down -v
